name: Run Java Git Diff By Local

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Build classpath and compile
        working-directory: openai-code-review-sdk
        run: |
          mvn -B dependency:build-classpath -Dmdep.outputFile=classpath.txt
          mvn -B compile

      - name: Run Java code
        working-directory: openai-code-review-sdk
        run: |
          CP="target/classes:$(cat classpath.txt)"
          java -cp "$CP" com.yh.middleware.sdk.OpenAiCodeReview